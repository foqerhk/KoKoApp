name: KoKo
options:
  bundleIdPrefix: com.foqerhk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  SwiftTerm:
    path: Packages/SwiftTerm
  Citadel:
    path: Packages/Citadel
targets:
  KoKo:
    type: application
    platform: iOS
    sources:
      - path: KoKo
    info:
      path: KoKo/Info.plist
      properties:
        CFBundleDisplayName: KoKo
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: KoKo connects to your servers over SSH so you can run AI agents in a terminal.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.foqerhk.koko
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: 3
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: NO
      ENABLE_PREVIEWS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: U5SLTWD6AH
      CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - package: SwiftTerm
      - package: Citadel
